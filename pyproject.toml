[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "netmon"
version = "0.1.0"
description = "Safe, scheduled Nmap-based network monitoring with change detection, alerting and Prometheus metrics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Sabry Ayoub" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0",
  "defusedxml>=0.7.1",     # hardened XML parsing for Nmap output (no XXE / entity bombs)
  "httpx>=0.27",           # Slack / webhook alerting
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pip-audit>=2.7",
]

[project.scripts]
netmon = "netmon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netmon"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = [
  "S603",     # subprocess without shell is the intended, audited pattern in scanner/runner.py
  "ASYNC109", # explicit timeout param on Runner.run is part of the injectable interface
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["netmon"]

plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["defusedxml.*", "fastapi.*", "uvicorn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["netmon.api"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires a real nmap binary (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["netmon"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
omit = ["src/netmon/api.py"]
