# Local stack: netmon + Prometheus. Run from repo root:
#   cp config/config.example.yaml deploy/config.yaml   # then edit scope!
#   docker compose -f deploy/docker-compose.yml up --build
services:
  netmon:
    build: ..
    restart: unless-stopped
    # host networking lets nmap see the real LAN (ARP, MAC vendors). Remove it to
    # scan only what the container network can route to.
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]   # only needed when nmap.privileged: true
    read_only: true
    security_opt: ["no-new-privileges:false"]  # file caps on nmap need this false
    tmpfs: [/tmp]
    volumes:
      - ./config.yaml:/etc/netmon/config.yaml:ro
      - netmon-data:/var/lib/netmon
    secrets: [slack_webhook]

  prometheus:
    image: prom/prometheus:v2.53.0
    network_mode: host
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

secrets:
  slack_webhook:
    file: ./secrets/slack_webhook   # referenced in config as file:/run/secrets/slack_webhook

volumes:
  netmon-data:
